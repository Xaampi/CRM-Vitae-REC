<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vitae REC · Panel de gestión</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- ============ LOGIN ============ -->
  <div class="login-wrap" id="login-screen">
    <div class="login-card">
      <!-- Logo real de Vitae REC pendiente: sustituir este bloque por
           <img src="logo-vitaerec.png" alt="Vitae REC" style="max-height:64px;"> -->
      <div class="login-logo">
        <img src="assets/logo-vitaerec.jpg" alt="Vitae REC" style="max-height:64px;max-width:220px;">
      </div>

      <div class="login-error" id="login-error">Usuario o contraseña incorrectos.</div>

      <form id="login-form">
        <div class="login-field">
          <label for="login-usuario">Usuario</label>
          <div class="login-input-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <input type="text" id="login-usuario" placeholder="Usuario" autocomplete="username" required>
          </div>
        </div>
        <div class="login-field">
          <label for="login-password">Contraseña</label>
          <div class="login-input-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" id="login-password" placeholder="Contraseña" autocomplete="current-password" required>
          </div>
        </div>
        <button class="login-btn" type="submit" id="login-btn">Entrar</button>
      </form>

      <div class="login-footer">Gorekia © 2026</div>
    </div>
  </div>

  <!-- ============ APP ============ -->
  <div class="app" id="app">
    <aside class="sidebar">
      <div class="sidebar-top">
        <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Contraer menú" title="Contraer menú">
          <i class="ti ti-layout-sidebar-left-collapse" id="sidebar-toggle-icon"></i>
        </button>
      </div>

      <div class="nav-section">Día a día</div>
      <nav>
        <button class="nav-item active" data-view="inicio">
          <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg></span>
          <span class="nav-label">Inicio</span>
                </button>
        <button class="nav-item" data-view="agenda">
          <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="8" y1="3" x2="8" y2="7"/><line x1="16" y1="3" x2="16" y2="7"/></svg></span>
          <span class="nav-label">Agenda</span>
                </button>
        <button class="nav-item" data-view="horario">
          <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="9" x2="9" y2="21"/></svg></span>
          <span class="nav-label">Horario semanal</span>
                </button>
        <button class="nav-item" data-view="clientes">
          <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9.5" cy="7" r="3.5"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span>
          <span class="nav-label">Clientes</span>
                </button>
        <button class="nav-item" data-view="bonos">
          <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2a2 2 0 0 0 0-4V8z"/><line x1="12" y1="7" x2="12" y2="9"/><line x1="12" y1="11" x2="12" y2="13"/><line x1="12" y1="15" x2="12" y2="17"/></svg></span>
          <span class="nav-label">Bonos</span>
                </button>
      </nav>

      <div class="nav-section">Gestión</div>
      <nav>
        <button class="nav-item" data-view="cobros">
          <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 8V6a2 2 0 0 0-2-2H5a2 2 0 0 0 0 4h15a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6"/><circle cx="17" cy="14" r="1.5"/></svg></span>
          <span class="nav-label">Cobros</span>
                </button>
        <button class="nav-item" data-view="equipo">
          <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><circle cx="17" cy="9.5" r="2.5"/><path d="M2 20v-1a5 5 0 0 1 5-5h4a5 5 0 0 1 5 5v1"/><path d="M16 20v-.5a3.5 3.5 0 0 1 3.5-3.5H20a2 2 0 0 1 2 2V20"/></svg></span>
          <span class="nav-label">Equipo y horas</span>
                </button>
        <button class="nav-item" data-view="servicios">
          <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4h6v3H9z"/><line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="16" x2="13" y2="16"/></svg></span>
          <span class="nav-label">Servicios</span>
                </button>
      </nav>

      <div class="nav-section">Bot</div>
      <nav>
        <button class="nav-item" data-view="derivaciones">
          <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l10 18H2L12 3z"/><line x1="12" y1="10" x2="12" y2="14"/><circle cx="12" cy="17.5" r=".8" fill="currentColor" stroke="none"/></svg></span>
          <span class="nav-label">Derivaciones</span>
                </button>
      </nav>

      <div class="nav-section">Sistema</div>
      <nav>
        <button class="nav-item" data-view="config">
          <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg></span>
          <span class="nav-label">Configuración</span>
                </button>
      </nav>

      <div class="sidebar-footer">
        <div class="who">
          <div class="avatar" id="user-avatar">S</div>
          <div class="who-name" id="user-name">Sonia</div>
        </div>
        <button class="logout-btn" id="logout-btn">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          <span class="logout-label">Cerrar sesión</span>
        </button>
      </div>
    </aside>

    <main class="main">
      <div class="topbar">
        <h1 id="topbar-title">Inicio</h1>
      </div>
      <div class="content">
        <div id="views-container"></div>
      </div>
    </main>
  </div>

<script src="js/app.js"></script>

</body>
</html>
